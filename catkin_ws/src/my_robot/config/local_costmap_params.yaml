# Obstacle-avoidance costmap: a 4 x 4 m window that rolls with the robot and is built from
# live lidar only, so an object dropped in the robot's path shows up and stops or reroutes it.
local_costmap:
  global_frame: odom
  robot_base_frame: robot_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  width: 4.0
  height: 4.0
  resolution: 0.05
  rolling_window: true
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
