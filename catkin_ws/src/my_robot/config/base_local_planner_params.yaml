controller_frequency: 10.0

TrajectoryPlannerROS:
  # Slow enough that AMCL updates (every 0.1 m / 0.2 rad) keep up with the robot.
  max_vel_x: 0.5
  min_vel_x: 0.05
  max_vel_theta: 1.0
  min_in_place_vel_theta: 0.4
  escape_vel: -0.1

  acc_lim_theta: 3.0
  acc_lim_x: 1.5
  acc_lim_y: 0.0

  # Within 0.15 m and ~0.15 rad of the Navigation Goal counts as arrived.
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15

  sim_time: 1.5
  vx_samples: 6
  vtheta_samples: 20

  # Score trajectories in metres rather than cells (silences the meter_scoring warning).
  meter_scoring: true
  path_distance_bias: 0.6
  goal_distance_bias: 0.8
  occdist_scale: 0.02

  holonomic_robot: false
