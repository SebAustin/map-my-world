# Shared by the global and local costmaps (loaded into each namespace by amcl.launch).
# Based on Udacity's where_am_i config, retuned for this robot and its /scan lidar.
map_type: costmap

# Mark obstacles seen within 2.5 m; clear free space along beams out to 3.0 m.
obstacle_range: 2.5
raytrace_range: 3.0

transform_tolerance: 0.5

# The real 0.5 x 0.3 m chassis, centred on robot_footprint, instead of a circle.
footprint: [[-0.25, -0.15], [-0.25, 0.15], [0.25, 0.15], [0.25, -0.15]]
footprint_padding: 0.02
# Keeps the robot ~0.35 m off walls while the 1.8 m doorway stays passable.
inflation_radius: 0.35
cost_scaling_factor: 5.0

observation_sources: laser_scan_sensor
laser_scan_sensor: {sensor_frame: hokuyo, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
